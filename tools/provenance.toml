[[origin]]
glob = "src/gpu/spirv/coopmat_gemm_bf16_bn128.spv"
text = "glslc output of coopmat_gemm.comp with the bf16 face and the guard and mask faces off, at the 128 x 128 tile (`BF16_TILE_WIDE`). The tile flags are not recorded in the source tree, so this entry names no glslc arguments and `--recompile` skips it."
source = "src/gpu/spirv/coopmat_gemm.comp"

